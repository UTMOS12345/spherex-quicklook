name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
      - name: streamlit is not a dependency
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('streamlit') is not None)"
      - name: pytest (unit tests, no network)
        env:
          SPHEREX_CACHE: ${{ runner.temp }}/spherex-cache
        run: pytest -q tests
